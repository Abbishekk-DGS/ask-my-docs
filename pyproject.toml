[project]
name = "inkrecall"
version = "0.1.0"
description = "Private, fully local RAG: chat with your PDFs and notes using hybrid search and cited answers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abbishekk DGS" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "numpy>=1.26", "pypdf>=4.2"]

[project.urls]
Homepage = "https://abbishekkdgs.tech"
Repository = "https://github.com/Abbishekk-DGS/inkrecall"

[project.optional-dependencies]
ui = ["streamlit>=1.50"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
inkrecall = "inkrecall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
